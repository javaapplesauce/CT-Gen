paths:
  base_dir: ${oc.env:CTGEN_BASE,/home/ubuntu/ctgen}
  ct_clip_dir: ${paths.base_dir}/CT-CLIP
  ct_clip_weights: ${paths.base_dir}/models/CT-CLIP_v2.pt
  pt_dir: ${paths.base_dir}/data/ct_rate_pt
  raw_dir: ${paths.base_dir}/data/ct_rate_raw
  ckpt_dir: ${paths.base_dir}/ckpts

model:
  llm_id: google/gemma-3-4b-it
  llm_hidden_dim: 2560

  # CTViT token geometry (40-slice preprocessing)
  visual_token_dim: 512
  ctvit_t: 4
  ctvit_h: 24
  ctvit_w: 24
  target_t: 4
  target_s: 8
  # Derived: num_visual_tokens = target_t * target_s * target_s = 256

  # LoRA — r=32/alpha=64 for a full training run.
  # Dropout bumped to 0.1 for the ~5k-sample regime to curb overfitting.
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Stage 1: projector-only alignment
# Projector is randomly initialized — LLaVA-style alignment benefits from a
# noticeably higher LR than stage 2. 1e-3 is the standard choice.
stage1:
  epochs: 3
  lr: 1e-3
  batch_size: 1         # NOTE: raising this requires fixing total_steps formula in train.py
  accum_steps: 8        # effective batch = batch_size × accum × n_gpus = 64 on 8 GPUs
  log_every: 50

# Stage 2: instruction tuning (projector + LoRA)
# Projector is already aligned, so lower LR. LoRA LR = lr × 0.1 is hardcoded
# in train.py — keeping projector at 2e-4 keeps LoRA at 2e-5, which is on the
# low side but safe given the small dataset. Epochs raised to 10 because at
# ~4.4k train samples / eff-batch 64, 8 epochs is only ~544 optimizer steps.
stage2:
  epochs: 10
  lr: 2e-4              # projector LR
  # lora_lr: 1e-4       # optional: override LoRA LR. Defaults to lr × 0.1 if unset.
  batch_size: 1
  accum_steps: 8
  log_every: 50

data:
  test_split: 0.05      # ~250 held-out test samples at volume_limit=5000
  val_split: 0.08       # ~380 val / ~4370 train
  num_workers: 8        # bumped from 4 — A100 nodes have ample CPU; set 0 if tokenizer pickling fails

  repo_id: ibrahimhamamci/CT-RATE
  reports_hf_path: dataset/radiology_text_reports/validation_reports.csv
  train_reports_hf_path: dataset/radiology_text_reports/train_reports.csv
  volume_limit: 5000    # null = all volumes
  chunk_size: 100       # larger download chunks, fewer HF round-trips
  preprocess_workers: 0

instruction: >-
  The CT scan has been encoded as visual feature tokens above.
  Write a structured radiological report based on these features.
  Include Findings and Impression sections. Do not ask for additional input.

tokens:
  visual_start: "<|visual_start|>"
  visual_end: "<|visual_end|>"

eval:
  checkpoint: stage2/best
  max_tokens: 512
  val_metric_samples: 100  # reports generated per validation epoch (0 = disable).
                           # Bumped from 50 — gives stabler ROUGE/BERTScore estimates
                           # across ~380 val samples without much extra wall-time.

wandb:
  project: ${oc.env:WANDB_PROJECT,ct-gen-vlm}

inference:
  max_tokens: 300

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
